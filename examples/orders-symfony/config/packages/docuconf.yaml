# Every variable the service reads, written as in contract.cue. Read them
# with %env(docuconf:NAME)%: the value docuconf validated, typed.
docuconf:
    name: orders-symfony
    vars:
        PORT: {type: int, description: HTTP listen port, min: 1, max: 65535, default: 8080}
        LOG_LEVEL: {type: enum, description: Minimum log level, values: [debug, info, warn, error], default: info}
        DATABASE_URL: {type: url, description: Orders database connection string, required: true, secret: true, schemes: [postgres, postgresql], maxLength: 2048}
        ALLOWED_ORIGINS: {type: list, description: Origins allowed to call the API (CORS), items: string, minItems: 1, default: ['http://localhost:3000']}
        REQUEST_TIMEOUT: {type: duration, description: Timeout for each request, min: 1s, max: 5m, default: 30s}
        WORKER_COUNT: {type: int, description: Number of background workers, min: 1, max: 64, default: 4}
        # A key set (SPEC 6.1): a secret list, "old,new" in one Secret key while a key is rotated.
        WEBHOOK_KEYS:
            type: list
            description: Keys that verify the signature on incoming payment webhooks
            details: |-
                A webhook is accepted when it is signed with any key in the list, so the key can be rotated without turning webhooks away. To rotate:

                 1. add the new key as the second item, and roll out;
                 2. switch the sender to the new key;
                 3. remove the old key, and roll out.

                Each key is 32 to 256 characters, so an empty or truncated key fails at boot. Without this variable, the service rejects every webhook.
            secret: true
            items: string
            minItems: 1
            maxItems: 2
            itemMinLength: 32
            itemMaxLength: 256

parameters:
    orders.port: '%env(docuconf:PORT)%'
    orders.request_timeout_seconds: '%env(docuconf_seconds:REQUEST_TIMEOUT)%'
